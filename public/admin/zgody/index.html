<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Zgody właścicieli | Panel Domiz Homes</title>
<link rel="icon" href="/pwa/icon-192.png">
<style>
:root{--b:#e2e8f0;--t:#1e293b;--m:#64748b;--p:#0f766e;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
header{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:1rem clamp(1rem,3vw,2rem);background:#fff;border-bottom:1px solid var(--b)}
header h1{margin:0;font-size:1.25rem}
header .sub{color:var(--m);font-size:.8rem}
a{color:var(--p)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:38px;padding:.45rem .9rem;border:1px solid var(--b);border-radius:9999px;background:#fff;color:var(--t);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn.sm{min-height:30px;padding:.2rem .6rem;font-size:.78rem}
main{padding:1rem clamp(1rem,3vw,2rem) 3rem;display:grid;gap:1rem;grid-template-columns:minmax(300px,420px) 1fr;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.msg{max-width:560px;margin:3rem auto;padding:1.5rem;background:#fff;border:1px solid var(--b);border-radius:12px;text-align:center;grid-column:1/-1}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:1rem}
.card h2{margin:0 0 .75rem;font-size:1rem}
form label{display:grid;gap:.2rem;font-size:.75rem;font-weight:700;color:var(--m);margin-bottom:.6rem}
form input,form select{min-height:38px;padding:.4rem .55rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:var(--t)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.row2 input,.row2 select,form input,form select{width:100%;min-width:0}
.small{font-size:.75rem;color:var(--m)}
.err{color:#b91c1c}
.result{margin-top:1rem;padding:.85rem;border-radius:10px;background:#ecfdf5;border:1px solid #a7f3d0}
.result textarea{width:100%;min-height:120px;font:inherit;font-size:14px;padding:.5rem;border:1px solid #a7f3d0;border-radius:8px;resize:vertical}
.result code{word-break:break-all;font-size:.8rem}
.actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:.45rem .5rem;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}
th{background:#f1f5f9;font-size:.74rem;white-space:nowrap}
.st{display:inline-block;padding:.08rem .5rem;border-radius:9999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.st-oczekuje{background:#fef3c7;color:#92400e}.st-potwierdzona{background:#dcfce7;color:#166534}.st-wycofana{background:#fee2e2;color:#991b1b}.st-odmowa{background:#f1f5f9;color:#475569}.st-wygasla{background:#f1f5f9;color:#64748b}
.yn{font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.filters button.on{background:var(--t);color:#fff;border-color:var(--t)}
.banner{margin-bottom:.75rem;padding:.6rem .8rem;border-radius:8px;background:#fffbeb;border:1px solid #fcd34d;font-size:.82rem}
</style>
</head>
<body>
<header>
  <div>
    <h1>Zgody właścicieli</h1>
    <div class="sub">Panel administratora Domiz Homes · link do zgody na bezpłatną publikację · bez numerów telefonów</div>
  </div>
  <nav style="display:flex;gap:.5rem;flex-wrap:wrap">
    <a class="btn" href="/admin">← Panel admina</a>
    <a class="btn" href="/admin/wlasciciele">Właściciele do kontaktu</a>
    <a class="btn" href="/admin/kawalerki">Kawalerki z ogródkiem</a>
    <button class="btn" id="logoutBtn" hidden>Wyloguj</button>
  </nav>
</header>
<main id="app"><div class="msg">Ładowanie…</div></main>
<script type="module" src="/admin/zgody/app.js"></script>
</body>
</html>
