<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Właściciele do kontaktu | Panel Domiz Homes</title>
<link rel="icon" href="/pwa/icon-192.png">
<style>
:root{--b:#e2e8f0;--t:#1e293b;--m:#64748b;--p:#0f766e;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
header{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:1rem clamp(1rem,3vw,2rem);background:#fff;border-bottom:1px solid var(--b)}
header h1{margin:0;font-size:1.25rem}
header .sub{color:var(--m);font-size:.8rem}
a{color:var(--p)}
.btn{display:inline-flex;align-items:center;gap:.35rem;min-height:38px;padding:.45rem .9rem;border:1px solid var(--b);border-radius:9999px;background:#fff;color:var(--t);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
main{padding:1rem clamp(1rem,3vw,2rem) 3rem}
.msg{max-width:560px;margin:3rem auto;padding:1.5rem;background:#fff;border:1px solid var(--b);border-radius:12px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem;margin-bottom:1rem}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:.85rem 1rem}
.card h3{margin:0 0 .5rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--m)}
.big{font-size:1.8rem;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:.5rem;padding:.12rem 0;font-size:.85rem}
.kv b{font-variant-numeric:tabular-nums}
.kv button{all:unset;cursor:pointer;color:var(--p)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end;background:#fff;border:1px solid var(--b);border-radius:12px;padding:.75rem;margin-bottom:.75rem}
.filters label{display:grid;gap:.2rem;font-size:.72rem;font-weight:700;color:var(--m)}
.filters input,.filters select{min-height:36px;padding:.35rem .5rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--b);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1200px}
th,td{padding:.45rem .55rem;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#f1f5f9;font-size:.74rem;cursor:pointer;user-select:none;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td select{font:inherit;padding:.2rem;border-radius:6px;border:1px solid #cbd5e1}
td textarea{width:220px;min-height:34px;font:inherit;font-size:.8rem;padding:.25rem;border:1px solid #cbd5e1;border-radius:6px;resize:vertical}
.tag{display:inline-block;padding:.05rem .45rem;border-radius:9999px;font-size:.72rem;font-weight:700;background:#f1f5f9}
.tag.sale{background:#fef3c7;color:#92400e}.tag.rent{background:#e0f2fe;color:#075985}.tag.nordic{background:#dcfce7;color:#166534}
.s-nowy{background:#ecfeff}.s-napisano{background:#eff6ff}.s-rozmowa{background:#fff7ed}.s-umowa{background:#ecfdf5}.s-odpada{background:#fef2f2;color:#991b1b}
.small{font-size:.75rem;color:var(--m)}
.saved{color:#16a34a;font-size:.7rem}
.err{color:#b91c1c}
.banner{margin-bottom:.75rem;padding:.6rem .8rem;border-radius:8px;background:#fffbeb;border:1px solid #fcd34d;font-size:.85rem}
</style>
</head>
<body>
<header>
  <div>
    <h1>Właściciele do kontaktu</h1>
    <div class="sub">Panel administratora Domiz Homes · ogłoszenia prywatne · dane tylko po zalogowaniu</div>
  </div>
  <nav style="display:flex;gap:.5rem;flex-wrap:wrap">
    <a class="btn" href="/admin">← Panel admina</a>
    <a class="btn" href="/admin/kawalerki">Mieszkania z ogródkiem – Warszawa</a>
    <label class="btn primary" id="importBtn" hidden>Importuj CSV<input type="file" id="csvFile" accept=".csv,text/csv" hidden></label>
    <button class="btn" id="logoutBtn" hidden>Wyloguj</button>
  </nav>
</header>
<main id="app"><div class="msg">Ładowanie…</div></main>
<script type="module" src="/admin/wlasciciele/app.js"></script>
</body>
</html>
