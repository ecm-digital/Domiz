<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Kawalerki z ogródkiem | Panel Domiz Homes</title>
<link rel="icon" href="/og-image.png">
<style>
:root{--b:#e2e8f0;--t:#1e293b;--m:#64748b;--p:#0f766e;--bg:#f8fafc}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
header{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:1rem clamp(1rem,3vw,2rem);background:#fff;border-bottom:1px solid var(--b)}
header h1{margin:0;font-size:1.25rem}
header .sub{color:var(--m);font-size:.8rem}
a{color:var(--p)}
.btn{display:inline-flex;align-items:center;gap:.35rem;min-height:38px;padding:.45rem .9rem;border:1px solid var(--b);border-radius:9999px;background:#fff;color:var(--t);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
main{padding:1rem clamp(1rem,3vw,2rem) 3rem}
.msg{max-width:560px;margin:3rem auto;padding:1.5rem;background:#fff;border:1px solid var(--b);border-radius:12px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem;margin-bottom:1rem}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:.85rem 1rem}
.card h3{margin:0 0 .5rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--m)}
.big{font-size:1.8rem;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:.5rem;padding:.12rem 0;font-size:.85rem}
.kv b{font-variant-numeric:tabular-nums}
.kv button{all:unset;cursor:pointer;color:var(--p)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end;background:#fff;border:1px solid var(--b);border-radius:12px;padding:.75rem;margin-bottom:.75rem}
.filters label{display:grid;gap:.2rem;font-size:.72rem;font-weight:700;color:var(--m)}
.filters input,.filters select{min-height:36px;padding:.35rem .5rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--b);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1200px}
th,td{padding:.45rem .55rem;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#f1f5f9;font-size:.74rem;cursor:pointer;user-select:none;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td select{font:inherit;padding:.2rem;border-radius:6px;border:1px solid #cbd5e1}
td textarea{width:220px;min-height:34px;font:inherit;font-size:.8rem;padding:.25rem;border:1px solid #cbd5e1;border-radius:6px;resize:vertical}
.tag{display:inline-block;padding:.05rem .45rem;border-radius:9999px;font-size:.72rem;font-weight:700;background:#f1f5f9}
.tag.sale{background:#fef3c7;color:#92400e}.tag.rent{background:#e0f2fe;color:#075985}.tag.nordic{background:#dcfce7;color:#166534}
.s-nowy{background:#ecfeff}.s-napisano{background:#eff6ff}.s-rozmowa{background:#fff7ed}.s-umowa{background:#ecfdf5}.s-odpada{background:#fef2f2;color:#991b1b}
.small{font-size:.75rem;color:var(--m)}
.saved{color:#16a34a;font-size:.7rem}
.err{color:#b91c1c}
.top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.75rem;margin-bottom:1rem}
.top3 .card b.n{display:inline-flex;width:1.6rem;height:1.6rem;align-items:center;justify-content:center;border-radius:50%;background:var(--p);color:#fff;margin-right:.4rem}
.tag.ok{background:#dcfce7;color:#166534}.tag.no{background:#fee2e2;color:#991b1b}.tag.chk{background:#fef3c7;color:#92400e}
tr.over td{color:#94a3b8}
.caveats{display:grid;gap:.5rem;margin-top:1rem}
.caveats .card p{margin:.2rem 0 0;font-size:.85rem}
h2.sec{font-size:1rem;margin:1.25rem 0 .5rem}
.filters .toggle input{min-height:0;width:18px;height:18px;padding:0}
.tablewrap table{min-width:1000px}
td:nth-child(2){min-width:220px}
.toggle{display:flex!important;align-self:center;align-items:center;gap:.4rem;font-weight:600;font-size:.85rem;cursor:pointer}
.banner{margin-bottom:.75rem;padding:.6rem .8rem;border-radius:8px;background:#fffbeb;border:1px solid #fcd34d;font-size:.85rem}
.badge{display:inline-block;padding:.12rem .5rem;border-radius:9999px;font-size:.72rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;vertical-align:1px}
.badge.gold,.ribbon.gold{background:#fbbf24;color:#422006}.badge.silver,.ribbon.silver{background:#cbd5e1;color:#1e293b}.badge.bronze,.ribbon.bronze{background:#d97706;color:#fff}
.topcard{position:relative;border-width:3px;padding-top:.75rem}
.topcard.gold{border-color:#f59e0b;background:#fffbeb}.topcard.silver{border-color:#94a3b8;background:#f8fafc}.topcard.bronze{border-color:#b45309;background:#fff7ed}
.ribbon{display:inline-block;padding:.3rem .8rem;border-radius:8px;font-weight:800;font-size:1rem;letter-spacing:.03em;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.topcard .tt{margin-top:.45rem;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--m)}
.topcard .why{margin:.2rem 0 .5rem;font-size:.85rem;line-height:1.4}
.topcard .kv{border-top:1px dashed var(--b)}
.legend{background:#fff;border:1px solid var(--b);border-left:4px solid #f59e0b;border-radius:8px;padding:.6rem .9rem;margin-bottom:.75rem;font-size:.85rem}
.legend ol{margin:.35rem 0 .35rem 1.1rem;padding:0}
tr.toprow td{font-weight:500}
tr.toprow.gold td{background:#fffbeb}tr.toprow.silver td{background:#f1f5f9}tr.toprow.bronze td{background:#fff7ed}
tr.toprow.gold td:first-child{box-shadow:inset 5px 0 #f59e0b}tr.toprow.silver td:first-child{box-shadow:inset 5px 0 #94a3b8}tr.toprow.bronze td:first-child{box-shadow:inset 5px 0 #b45309}
.badge.off,.ribbon.off{background:#e2e8f0;color:#334155;border:1px dashed #64748b}
.topcard.off{border-style:dashed;border-color:#94a3b8;background:#fff}
.tag.wt{background:#ede9fe;color:#5b21b6;border:1px solid #a78bfa}
.badge.wt,.ribbon.wt{background:#7c3aed;color:#fff}
.topcard.wt{border-color:#7c3aed;background:#f5f3ff}
tr.toprow.wt td{background:#f5f3ff}tr.toprow.wt td:first-child{box-shadow:inset 5px 0 #7c3aed}
.legend.wt{border-left:4px solid #7c3aed;background:#f5f3ff}
.mkt{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.6rem 0 .2rem;font-weight:700}
.mktbtn{border:2px solid #7c3aed;background:#fff;color:#5b21b6;border-radius:9999px;padding:.3rem .9rem;font-weight:700;cursor:pointer}
.mktbtn.on{background:#7c3aed;color:#fff}
tr.toprow.off td{background:#f8fafc}tr.toprow.off td:first-child{box-shadow:inset 5px 0 #cbd5e1}
.legend.nordic{border-left-color:#0f766e;background:#f0fdfa}
.top3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.z-kicker{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:.35rem}
.z-unit h3{font-size:1.05rem;margin:.2rem 0}
.z-unit .kv b.wrap,.z-unit .kv span:last-child{text-align:right;max-width:68%}
.z-list{margin:.4rem 0 0;padding-left:1.1rem}
.z-list li{margin:.35rem 0}
.z-list-cards{display:grid;gap:.75rem}
details{margin-top:.4rem}
summary{cursor:pointer;font-weight:700}
.settabs{display:flex;gap:.4rem;margin:0 0 .8rem;flex-wrap:wrap}
@media (max-width:720px){
  header h1{font-size:1.05rem}
  .filters label{flex:1 1 140px}
  .kv b.wrap{max-width:100%}
}
.settab{font:inherit;padding:.5rem 1rem;border-radius:999px;border:1px solid #cfd6de;background:#fff;cursor:pointer;font-weight:600}
.settab.on{background:#1f3a4d;color:#fff;border-color:#1f3a4d}
</style>
</head>
<body>
<header>
  <div>
    <h1>Kawalerki z ogródkiem</h1>
    <div class="sub">Panel administratora Domiz Homes · zestawienie 6.11.2026 i starsze odczyty · tylko po zalogowaniu</div>
  </div>
  <nav style="display:flex;gap:.5rem;flex-wrap:wrap">
    <a class="btn" href="/admin">← Panel admina</a>
    <a class="btn" href="/admin/wlasciciele">Właściciele do kontaktu</a>
    <a class="btn" href="/admin/zgody">Zgody właścicieli</a>
    <button class="btn" id="logoutBtn" hidden>Wyloguj</button>
  </nav>
</header>
<main id="app"><div class="msg">Ładowanie…</div></main>
<script type="module" src="/admin/kawalerki/app.js"></script>
</body>
</html>
